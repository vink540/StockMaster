{% extends 'base.html' %}

{% block title %}Editar Perfil - StockMaster{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div class="card-header">
        <h1 class="card-title">
            <i class="fas fa-user-edit"></i>
            Editar Perfil
        </h1>
        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 3rem; color: white; font-weight: bold;">
                {{ user.username|first|upper }}
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
            <div class="form-group">
                <label for="first_name">
                    <i class="fas fa-user"></i> Nombre
                </label>
                <input type="text" 
                       name="first_name" 
                       id="first_name" 
                       class="form-control" 
                       value="{{ user.first_name }}">
            </div>
            
            <div class="form-group">
                <label for="last_name">
                    <i class="fas fa-user"></i> Apellido
                </label>
                <input type="text" 
                       name="last_name" 
                       id="last_name" 
                       class="form-control" 
                       value="{{ user.last_name }}">
            </div>
            
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email
                </label>
                <input type="email" 
                       name="email" 
                       id="email" 
                       class="form-control" 
                       value="{{ user.email }}">
            </div>
            
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-at"></i> Nombre de Usuario
                </label>
                <input type="text" 
                       class="form-control" 
                       value="{{ user.username }}"
                       disabled
                       style="background: #f0f0f0;">
                <small style="color: #777; display: block; margin-top: 5px;">
                    El nombre de usuario no se puede cambiar
                </small>
            </div>
        </div>
        
        <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
            <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
